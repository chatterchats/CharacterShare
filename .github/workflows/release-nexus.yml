name: Release to Nexus Mods

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-release
  cancel-in-progress: false

jobs:
  release:
    name: Package and upload
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read release metadata
        id: release
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import uuid
          from pathlib import Path

          metadata_files = (
              Path("src/Character Share/modinfo.json"),
              Path("src/Character Share/zcom-mod.json"),
          )
          versions = {}
          for metadata_file in metadata_files:
              if not metadata_file.is_file():
                  continue
              with metadata_file.open(encoding="utf-8") as stream:
                  version = json.load(stream).get("version")
              if not isinstance(version, str) or not version.strip():
                  raise SystemExit(f"Missing version in {metadata_file}")
              versions[metadata_file] = version.strip()

          if not versions:
              raise SystemExit("Neither modinfo.json nor zcom-mod.json exists")
          if len(set(versions.values())) != 1:
              details = ", ".join(f"{path}: {version}" for path, version in versions.items())
              raise SystemExit(f"Metadata versions do not match: {details}")

          version = next(iter(versions.values()))
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit(f"Version must use #.#.# format, got {version!r}")

          changelog_text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          section = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(?P<body>.*?)(?=^## \[|\Z)",
              changelog_text,
              flags=re.MULTILINE | re.DOTALL,
          )
          if section is None or not section.group("body").strip():
              raise SystemExit(f"CHANGELOG.md has no non-empty [{version}] section")
          changelog = section.group("body").strip()

          delimiter = f"CHANGELOG_{uuid.uuid4().hex}"
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"package_name=Character Share V{version}.zip\n")
              output.write(f"changelog<<{delimiter}\n{changelog}\n{delimiter}\n")
          PY

      - name: Resolve Nexus IDs
        id: nexus
        shell: bash
        env:
          NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          api_base = "https://api.nexusmods.com/v3"
          api_key = os.environ["NEXUSMODS_API_KEY"].strip()
          if not api_key:
              raise SystemExit("NEXUSMODS_API_KEY is empty")

          def api_get(path):
              request = Request(
                  f"{api_base}{path}",
                  headers={
                      "apikey": api_key,
                      "User-Agent": "chatterchats/CharacterShare release workflow",
                  },
              )
              try:
                  with urlopen(request, timeout=30) as response:
                      return json.load(response)
              except HTTPError as error:
                  detail = error.read().decode("utf-8", errors="replace")
                  raise SystemExit(
                      f"Nexus API request failed for {path}: {error.code} {detail}"
                  ) from error

          mod = api_get("/games/starwarszerocompany/mods/176").get("data", {})
          mod_id = mod.get("id")
          if not isinstance(mod_id, str) or not mod_id:
              raise SystemExit("Nexus API response did not contain the mod's unique ID")

          payload = api_get(f"/mods/{quote(mod_id, safe='')}/files").get("data", {})
          active_files = [
              mod_file
              for mod_file in payload.get("mod_files", [])
              if mod_file.get("is_active")
          ]
          if len(active_files) != 1:
              names = ", ".join(
                  str(mod_file.get("name", "<unnamed>")) for mod_file in active_files
              )
              raise SystemExit(
                  "Expected exactly one active Nexus mod file for Character Share, "
                  f"found {len(active_files)}: {names or '<none>'}"
              )

          file_id = active_files[0].get("id")
          if not isinstance(file_id, str) or not file_id:
              raise SystemExit("Nexus API response did not contain the mod file's unique ID")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"mod_id={mod_id}\n")
              output.write(f"file_id={file_id}\n")
          PY

      - name: Package mod
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
        run: |
          mkdir -p dist
          (cd src && zip -r "../dist/${PACKAGE_NAME}" "Character Share")
          ln "dist/${PACKAGE_NAME}" "Character Share.zip"

      - name: Upload to Nexus Mods
        uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ steps.nexus.outputs.file_id }}
          filename: Character Share.zip
          version: ${{ steps.release.outputs.version }}
          display_name: Character Share
          mod_id: ${{ steps.nexus.outputs.mod_id }}
          primary_mod_manager_download: true
          update_mod_version: true
          changelog: ${{ steps.release.outputs.changelog }}
